# nginx/default.conf

# Server block cho Kibana
server {
    # Nginx sẽ lắng nghe ở cổng 5601 (khớp với docker-compose)
    listen 5601;
    server_name localhost;

    location / {
        auth_basic "Restricted Kibana Access";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        # Chuyển tiếp request đến Kibana (đang chạy ở cổng 5601)
        proxy_pass http://kibana:5601;
        
        # ... các proxy_set_header khác ...
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Server block cho FastAPI API
server {
    # Nginx sẽ lắng nghe ở cổng 8000 (khớp với docker-compose)
    listen 8000;
    server_name localhost;

    location / {
        # Chuyển tiếp request đến FastAPI server 
        # (tên service là fastapi_server, đang chạy ở cổng 8001 theo Dockerfile)
        proxy_pass http://fastapi_server:8001;
        
        # ... các proxy_set_header khác ...
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}